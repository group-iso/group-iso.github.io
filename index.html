    <h1>Pythagorean Theorem</h1>
    <p>In a right triangle with legs <i>a</i> and <i>b</i> and hypotenuse <i>c</i>:</p>
    <p><i>a</i><sup>2</sup> + <i>b</i><sup>2</sup> = <i>c</i><sup>2</sup>.</p>
