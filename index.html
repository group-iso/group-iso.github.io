<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GroupIso</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #f8fafc;
      color: #172033;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%;
      max-width: 40rem;
      padding: clamp(2rem, 7vw, 4rem);
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      background: #fff;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 4rem);
      line-height: 1.1;
      letter-spacing: -0.05em;
    }
    p {
      margin: 1.25rem 0 0;
      color: #526176;
      font-size: 1.125rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>GroupIso</h1>
    <p>Website coming soon.</p>
  </main>
</body>
</html>
